name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check-types

      - run: npm run lint

      - run: npm run test:unit

      # xvfb provides the X11 display the Linux VS Code test host needs
      # headless; Windows has no X11 and doesn't need one to run headless.
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - if: runner.os == 'Windows'
        run: npm run test:integration
